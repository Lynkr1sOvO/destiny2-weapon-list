<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Destiny 2 · 本赛季武器清单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="page">
      <header class="hero">
        <div class="hero-top">
          <div>
            <p class="hero-kicker">Destiny 2</p>
            <h1 id="season-title">本赛季可获取武器清单</h1>
            <p class="hero-note" id="season-note"></p>
          </div>
          <nav class="nav-links">
            <a class="nav-link nav-link-primary" href="editor.html">编辑清单</a>
          </nav>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="count-total">0</span>
            <span class="stat-label">武器总数</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="count-visible">0</span>
            <span class="stat-label">当前可见</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="count-sections">0</span>
            <span class="stat-label">获取途径</span>
          </div>
        </div>
      </header>

      <div id="draft-banner" class="status-bar status-info" hidden>
        正在显示本机编辑草稿（尚未导出到 data.js）。其他人打开文件夹时仍看到文件里的旧数据；编辑后请导出并覆盖
        <code>data.js</code>。
      </div>

      <div class="toolbar">
        <div class="field">
          <label for="search">搜索</label>
          <input
            id="search"
            type="search"
            placeholder="武器名、Perk、备注…"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="filter-type">武器类型</label>
          <select id="filter-type">
            <option value="">全部</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-ammo">弹药类型</label>
          <select id="filter-ammo">
            <option value="">全部</option>
            <option value="主要">主要</option>
            <option value="特殊">特殊</option>
            <option value="威能">威能</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-rating">评级</label>
          <select id="filter-rating">
            <option value="">全部</option>
            <option value="S">S</option>
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="C+">C+</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-element">属性</label>
          <select id="filter-element">
            <option value="">全部</option>
            <option value="动能">动能</option>
            <option value="烈日">烈日</option>
            <option value="电弧">电弧</option>
            <option value="虚空">虚空</option>
            <option value="冰影">冰影</option>
            <option value="缚丝">缚丝</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-champ">反勇士</label>
          <select id="filter-champ">
            <option value="">全部</option>
            <option value="势不可挡">势不可挡</option>
            <option value="屏障">屏障</option>
            <option value="过载">过载</option>
          </select>
        </div>
        <div class="field">
          <label>Perk 展示</label>
          <div class="toggle-group">
            <label class="toggle-chip">
              <input type="checkbox" id="view-show-pve" checked />
              PVE
            </label>
            <label class="toggle-chip">
              <input type="checkbox" id="view-show-pvp" checked />
              PVP
            </label>
          </div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="btn-reset" id="reset-filters">重置</button>
        </div>
      </div>

      <main id="app"></main>

      <p class="footer-hint">
        填写数据：打开 <a href="editor.html">编辑清单</a>。分享给他人请用编辑器「导出分享页（单文件）」，或运行
        <code>publish.bat</code> 更新托管用的 <code>docs/</code> 目录。
      </p>
    </div>

    <script src="data.js"></script>
    <script src="storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
