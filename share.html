<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>凯旋纪念碑 全武器刷取清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-deep: #0b0e12;
  --bg-panel: #12171f;
  --bg-row: #161c26;
  --bg-row-alt: #1a212c;
  --bg-hover: #222b38;
  --line: rgba(212, 175, 95, 0.18);
  --line-strong: rgba(212, 175, 95, 0.35);
  --gold: #d4af5f;
  --gold-soft: #e6c98a;
  --text: #e8edf4;
  --text-dim: #9aa6b8;
  --text-mute: #6d7a8c;
  --solar: #ff6b2c;
  --arc: #79e0ff;
  --void: #b07aff;
  --stasis: #4d8fff;
  --strand: #2fd67a;
  --kinetic: #e4e8ef;
  --ammo-primary: #f4f6fa;
  --ammo-special: #3dce6e;
  --ammo-heavy: #c48bff;
  --s: #f0c14a;
  --ap: #9be07a;
  --a: #7dcf8a;
  --bp: #8eb8e8;
  --b: #7aa6d9;
  --cp: #a8b4c4;
  --c: #9aa6b8;
  --d: #c48888;
  --radius: 2px;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --font-display: "Orbitron", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", "Segoe UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse 90% 50% at 10% -10%, rgba(212, 175, 95, 0.12), transparent 55%),
    radial-gradient(ellipse 70% 40% at 100% 0%, rgba(60, 90, 130, 0.18), transparent 50%),
    linear-gradient(180deg, #0f141c 0%, var(--bg-deep) 40%, #080a0e 100%);
  background-attachment: fixed;
}

.bg-grid {
  pointer-events: none;
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(212, 175, 95, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 175, 95, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 85%);
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  width: calc(100% - 1.5rem);
  max-width: none;
  margin: 0 auto;
  padding: 2rem 0 3rem;
}

.page-viewer .footer-hint {
  display: none;
}

/* —— Header —— */
.hero {
  margin-bottom: 1.75rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
}

.hero-kicker {
  margin: 0 0 0.5rem;
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
}

.hero h1 {
  margin: 0 0 0.6rem;
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3.5vw, 2.35rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.2;
  color: var(--text);
}

.hero-note {
  margin: 0;
  max-width: 42rem;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--text-dim);
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 1.25rem 1.75rem;
  margin-top: 1.25rem;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--gold-soft);
}

.stat-label {
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  color: var(--text-mute);
}

/* —— Toolbar —— */
.toolbar {
  display: grid;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
  padding: 1rem;
  background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}

@media (min-width: 900px) {
  .toolbar {
    grid-template-columns: 1.1fr repeat(5, minmax(0, 0.85fr)) auto auto;
    align-items: end;
  }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field label {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-mute);
}

.field input,
.field select {
  width: 100%;
  padding: 0.55rem 0.7rem;
  font: inherit;
  font-size: 0.9rem;
  color: var(--text);
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.15s ease;
}

.field input:focus,
.field select:focus {
  border-color: var(--line-strong);
}

.field input::placeholder {
  color: var(--text-mute);
}

.btn-reset {
  height: 2.35rem;
  padding: 0 1rem;
  font: inherit;
  font-size: 0.85rem;
  color: var(--gold-soft);
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.btn-reset:hover {
  color: var(--bg-deep);
  background: var(--gold);
}

/* —— Sections —— */
.sections {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.section {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-panel) 94%, transparent);
  box-shadow: var(--shadow);
  overflow: visible;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: 100%;
  padding: 0.9rem 1.1rem;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: linear-gradient(90deg, rgba(212, 175, 95, 0.12), transparent 55%);
  border: 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.section-header:hover {
  background: linear-gradient(90deg, rgba(212, 175, 95, 0.18), transparent 60%);
}

.section-header-static {
  cursor: default;
}

.section-header-static:hover {
  background: linear-gradient(90deg, rgba(212, 175, 95, 0.12), transparent 55%);
}

.section-title {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  min-width: 0;
}

.section-title h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.06em;
}

.section-count {
  font-size: 0.78rem;
  color: var(--text-mute);
  white-space: nowrap;
}

.section-note {
  flex: 1;
  min-width: 0;
  margin: 0 0.25rem;
  font-size: 0.82rem;
  font-weight: 400;
  line-height: 1.35;
  color: var(--text-dim);
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.section-note-empty {
  flex: 1;
}

.section-chevron {
  flex-shrink: 0;
  width: 0.55rem;
  height: 0.55rem;
  border-right: 2px solid var(--gold);
  border-bottom: 2px solid var(--gold);
  transform: rotate(45deg);
  transition: transform 0.2s ease;
}

.section.collapsed .section-chevron {
  transform: rotate(-45deg);
}

.section.collapsed .section-body {
  display: none;
}

.table-wrap {
  overflow-x: auto;
  overflow-y: visible;
  /* 原生横向条隐藏，改用窗口底部固定条 */
  scrollbar-width: none;
}

.table-wrap::-webkit-scrollbar {
  height: 0;
  display: none;
}

/* 固定在窗口底端的横向滚动条（与 .table-wrap 同步） */
.table-hscroll {
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 80;
  height: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  background: color-mix(in srgb, var(--bg-deep) 88%, #000);
  border-top: 1px solid var(--line);
}

.table-hscroll[hidden] {
  display: none !important;
}

.table-hscroll-spacer {
  height: 1px;
  pointer-events: none;
}

body.has-table-hscroll {
  padding-bottom: 14px;
}

table,
.weapon-table {
  width: 100%;
  min-width: 1180px;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 0.78rem;
}

/* 百分比列宽；min-width 保证窗口变窄时出现横向滚动 */
.weapon-table col.col-name { width: 8%; }
.weapon-table col.col-type { width: 6.5%; }
.weapon-table col.col-ammo { width: 3.5%; }
.weapon-table col.col-rating { width: 3.5%; }
.weapon-table col.col-frame { width: 5%; }
.weapon-table col.col-element { width: 3.5%; }
.weapon-table col.col-champ { width: 4.5%; }
.weapon-table col.col-mode { width: 3%; }
.weapon-table col.col-perk { width: 5.5%; }
.weapon-table col.col-sources { width: 11.9%; }
.weapon-table col.col-note { width: 13.1%; }

.weapon-table.weapon-table-with-sources {
  min-width: 1280px;
}

th,
td {
  box-sizing: border-box;
  height: 2.75rem;
  max-height: 2.75rem;
  padding: 0 0.45rem;
  text-align: center;
  vertical-align: middle;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  z-index: 3;
  height: 2.4rem;
  max-height: 2.4rem;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-mute);
  background-color: var(--bg-panel);
  border-bottom-color: transparent;
}

/* 双行表头：第二行上移 1px 叠住接缝，避免出现空隙 */
.weapon-table thead tr:nth-child(2) th {
  top: calc(2.4rem - 1px);
  z-index: 2;
  border-top: 0;
  box-shadow: none;
}

.weapon-table thead tr:first-child th {
  border-bottom: 0;
  box-shadow: none;
}

.weapon-table thead tr:last-child th {
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.06);
}

tbody tr.weapon-row.row-a {
  background: var(--bg-row);
}

tbody tr.weapon-row.row-b {
  background: var(--bg-row-alt);
}

tbody tr.weapon-row {
  height: auto;
}

tbody tr.weapon-row:hover {
  background: var(--bg-hover);
}

.name-cell {
  font-weight: 600;
  color: var(--text);
}

.note-cell {
  color: var(--text-dim);
}

.weapon-table td.note-cell {
  white-space: normal !important;
  overflow-wrap: anywhere;
  word-break: break-word;
  text-align: left;
  line-height: 1.35;
  height: auto !important;
  max-height: none !important;
  min-height: 2.75rem;
  overflow: visible !important;
  text-overflow: clip !important;
  vertical-align: middle;
  padding-top: 0.45rem;
  padding-bottom: 0.45rem;
}

.weapon-table td.note-cell .note-text {
  display: block;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.perk-cell {
  color: var(--text-dim);
}

.weapon-table td.perk-cell {
  white-space: normal !important;
  overflow-wrap: anywhere;
  word-break: break-word;
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  text-overflow: clip !important;
  line-height: 1.25;
  padding-top: 0.3rem;
  padding-bottom: 0.3rem;
}

.weapon-table td.perk-cell .perk-line {
  display: block;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.sources-cell {
  color: var(--text-dim);
}

.weapon-table td.sources-cell {
  white-space: normal !important;
  overflow-wrap: anywhere;
  word-break: break-word;
  text-align: center;
  line-height: 1.3;
  height: auto !important;
  max-height: none !important;
  min-height: 2.75rem;
  overflow: visible !important;
  text-overflow: clip !important;
  vertical-align: middle;
  padding-top: 0.35rem;
  padding-bottom: 0.35rem;
}

.weapon-table td.sources-cell .sources-line {
  display: block;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
  text-align: center;
}

.weapon-table td.frame-cell .frame-line,
.weapon-table td.name-cell,
.weapon-table td.type-cell,
.weapon-table td.champ {
  white-space: normal !important;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.weapon-table td.frame-cell,
.weapon-table td.name-cell,
.weapon-table td.type-cell,
.weapon-table td.champ {
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  text-overflow: clip !important;
  line-height: 1.25;
  padding-top: 0.3rem;
  padding-bottom: 0.3rem;
}

.mode-tag-cell {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.cell-pve {
  background: rgba(61, 140, 90, 0.08);
}

.cell-pvp {
  background: rgba(180, 90, 70, 0.08);
}

th.th-group {
  text-align: center;
  letter-spacing: 0.12em;
  background-color: var(--bg-panel);
}

th.th-pve {
  color: #8fd4a4;
  border-bottom-color: rgba(125, 207, 138, 0.25);
  /* 不透明，避免 sticky 时行内容透出 */
  background-color: #15241c;
}

th.th-pvp {
  color: #e8a090;
  border-bottom-color: rgba(232, 140, 110, 0.25);
  background-color: #241816;
}

.weapon-table td.frame-cell {
  color: var(--text-dim);
  white-space: normal !important;
  line-height: 1.25;
  height: auto !important;
  max-height: none !important;
  min-height: 2.75rem;
  overflow: visible !important;
  text-overflow: unset;
  vertical-align: middle;
  padding-top: 0.35rem;
  padding-bottom: 0.35rem;
}

.weapon-table td.frame-cell .frame-line {
  display: block;
  white-space: nowrap;
}

/* —— Tints (no boxes) —— */
.tint {
  font-weight: 600;
  letter-spacing: 0.03em;
}

.rating-S { color: var(--s); }
.rating-Ap { color: var(--ap); }
.rating-A { color: var(--a); }
.rating-Bp { color: var(--bp); }
.rating-B { color: var(--b); }
.rating-Cp { color: var(--cp); }
.rating-C { color: var(--c); }
.rating-D { color: var(--d); }
.rating-empty { color: var(--text-mute); }

.el-动能 { color: var(--kinetic); }
.el-烈日 { color: var(--solar); }
.el-电弧 { color: var(--arc); }
.el-虚空 { color: var(--void); }
.el-冰影 { color: var(--stasis); }
.el-缚丝 { color: var(--strand); }

.ammo-主要 { color: var(--ammo-primary); }
.ammo-特殊 { color: var(--ammo-special); }
.ammo-威能 { color: var(--ammo-heavy); }

.type-cell {
  color: var(--text-dim);
}

.champ {
  color: var(--gold-soft);
  font-size: 0.82rem;
}

.toggle-group {
  display: flex;
  gap: 0.4rem;
  height: 2.35rem;
  align-items: center;
}

.toggle-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  height: 2.35rem;
  padding: 0 0.7rem;
  font-size: 0.82rem;
  color: var(--text-dim);
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  user-select: none;
}

.toggle-chip:has(input:checked) {
  color: var(--gold-soft);
  border-color: var(--line-strong);
  background: rgba(212, 175, 95, 0.1);
}

.toggle-chip input {
  accent-color: var(--gold);
}

.empty-row td {
  height: auto;
  max-height: none;
  padding: 1.25rem;
  text-align: center;
  color: var(--text-mute);
  font-style: italic;
  white-space: normal;
}

.no-results {
  margin-top: 1.5rem;
  padding: 2rem;
  text-align: center;
  color: var(--text-mute);
  border: 1px dashed var(--line);
}

.footer-hint {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
  line-height: 1.6;
  color: var(--text-mute);
}

.footer-hint code {
  padding: 0.1rem 0.35rem;
  font-size: 0.78rem;
  color: var(--gold-soft);
  background: rgba(212, 175, 95, 0.1);
  border: 1px solid var(--line);
}

@media (max-width: 719px) {
  .page {
    width: calc(100% - 1.25rem);
    padding-top: 1.5rem;
  }

  th,
  td {
    padding: 0.55rem 0.65rem;
  }
}

/* —— Shared nav / status —— */
.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.hero-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.55rem;
  flex-shrink: 0;
}

.last-updated {
  margin: 0;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  color: var(--text-mute);
  white-space: nowrap;
}

.hero-compact {
  margin-bottom: 1.1rem;
  padding-bottom: 1.1rem;
}

.hero-compact h1 {
  font-size: clamp(1.35rem, 3vw, 1.9rem);
}

.nav-links {
  display: flex;
  gap: 0.5rem;
  flex-shrink: 0;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  padding: 0.55rem 0.95rem;
  font-size: 0.85rem;
  color: var(--gold-soft);
  text-decoration: none;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  transition: background 0.15s ease, color 0.15s ease;
}

.nav-link:hover,
.nav-link-primary {
  color: var(--bg-deep);
  background: var(--gold);
  border-color: var(--gold);
}

.nav-link-primary:hover {
  background: var(--gold-soft);
}

.status-bar {
  margin-bottom: 1rem;
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  line-height: 1.5;
  border: 1px solid var(--line);
  background: rgba(212, 175, 95, 0.08);
  color: var(--text-dim);
}

.status-bar code {
  padding: 0.05rem 0.3rem;
  color: var(--gold-soft);
  background: rgba(212, 175, 95, 0.1);
  border: 1px solid var(--line);
}

.status-ok {
  border-color: rgba(125, 207, 138, 0.35);
  background: rgba(125, 207, 138, 0.08);
}

.status-error {
  border-color: rgba(232, 110, 90, 0.4);
  background: rgba(232, 110, 90, 0.1);
  color: #f0b4a8;
}

.status-info {
  border-color: rgba(122, 166, 217, 0.35);
  background: rgba(122, 166, 217, 0.08);
}

.footer-hint a {
  color: var(--gold-soft);
}

/* —— Editor —— */
.page-wide {
  width: min(1680px, calc(100% - 2rem));
}

.meta-panel {
  display: grid;
  gap: 0.75rem;
  margin-bottom: 1rem;
  padding: 1rem;
  background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
  border: 1px solid var(--line);
}

@media (min-width: 800px) {
  .meta-panel {
    grid-template-columns: minmax(220px, 1fr) 2fr;
  }
}

.field-grow {
  min-width: 0;
}

.editor-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1.25rem;
}

.btn-primary,
.btn-secondary,
.btn-ghost,
.btn-file {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2.35rem;
  padding: 0 0.95rem;
  font: inherit;
  font-size: 0.85rem;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.btn-primary {
  color: var(--bg-deep);
  background: var(--gold);
  border: 1px solid var(--gold);
}

.btn-primary:hover {
  background: var(--gold-soft);
}

.btn-secondary,
.btn-file {
  color: var(--gold-soft);
  background: transparent;
  border: 1px solid var(--line-strong);
}

.btn-secondary:hover,
.btn-file:hover {
  color: var(--bg-deep);
  background: var(--gold);
}

.btn-ghost {
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--line);
}

.btn-ghost:hover {
  color: var(--text);
  border-color: var(--line-strong);
}

.btn-primary.sm,
.btn-secondary.sm,

.editor-layout {
  display: grid;
  gap: 1rem;
  align-items: stretch;
  min-height: 28rem;
}

@media (min-width: 960px) {
  .editor-layout {
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    grid-template-rows: minmax(9rem, 36vh) minmax(12rem, 1fr);
    max-height: calc(100vh - 8rem);
  }

  .editor-pane-sections {
    grid-column: 1;
    grid-row: 1;
  }

  .editor-pane-weapons {
    grid-column: 1;
    grid-row: 2;
  }

  .editor-main {
    grid-column: 2;
    grid-row: 1 / span 2;
    min-height: 0;
    max-height: 100%;
    overflow: auto;
  }
}

.editor-pane {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  min-height: 11rem;
  max-height: none;
  padding: 0.85rem;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-panel) 94%, transparent);
  box-shadow: var(--shadow);
  overflow: hidden;
}

    max-height: none;
    height: 100%;

  flex-shrink: 0;

}

.editor-pane .editor-section-rename,
.editor-pane .editor-section-note {
  flex-shrink: 0;

.editor-pane .editor-side-list {

  overflow: auto;

.editor-side-head {
  display: flex;

  gap: 0.5rem;
  margin-bottom: 0.65rem;
}

.editor-side-head h3 {

  letter-spacing: 0.08em;

.editor-side-list {
  display: flex;

  gap: 0.35rem;
}

.editor-side-item {
  display: flex;
  align-items: flex-start;
  gap: 0.35rem;
  width: 100%;
  padding: 0.55rem 0.6rem;
  text-align: left;
  font: inherit;
  color: var(--text);
  background: var(--bg-deep);
  border: 1px solid transparent;
  border-radius: var(--radius);

}

.editor-side-item:hover {
  border-color: var(--line);
}

.editor-side-item.is-active {

.editor-side-item-main {
  flex: 1;
  min-width: 0;
}

.editor-side-item-title {
  display: block;
  font-weight: 600;

}

.editor-side-item-meta {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.72rem;
  color: var(--text-mute);
  white-space: nowrap;
  overflow: hidden;

}

.editor-side-item-tools {
  display: flex;
  flex-shrink: 0;

.editor-section-rename {

  font-size: 0.9rem;

.editor-section-note {

}

.editor-side-empty {

  <script>/** 本地草稿：编辑页写入，清单页优先读取 */
const D2_STORAGE_KEY = "d2-weapon-list-draft";

function cloneData(data) {
  return JSON.parse(JSON.stringify(data));
}

function loadWeaponData() {
  if (typeof D2_SHARE_READONLY !== "undefined" && D2_SHARE_READONLY) {
    return { data: normalizeWeaponData(WEAPON_DATA), fromDraft: false };
  }
  try {
    const raw = localStorage.getItem(D2_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sections)) {
        return { data: normalizeWeaponData(parsed), fromDraft: true };
      }
    }
  } catch (_) {
    /* ignore corrupt draft */
  }
  return { data: normalizeWeaponData(WEAPON_DATA), fromDraft: false };
}

function saveWeaponDraft(data) {
  touchUpdatedAt(data);
  localStorage.setItem(D2_STORAGE_KEY, JSON.stringify(data));
}

function clearWeaponDraft() {
  localStorage.removeItem(D2_STORAGE_KEY);
}

function touchUpdatedAt(data) {
  if (!data || typeof data !== "object") return data;
  data.updatedAt = new Date().toISOString();
  return data;
}

function formatUpdatedAt(value) {
  if (!value) return "";
  const date = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(date.getTime())) return String(value).trim();
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function buildDataJs(data) {
  const next = cloneData(data);
  touchUpdatedAt(next);
  const payload = JSON.stringify(next, null, 2);
  return `/**
 * ============================================================
 *  Destiny 2 本赛季武器清单 — 数据填写文件
 * ============================================================
 *  推荐用 editor.html 可视化编辑后「导出 data.js」覆盖本文件。
 *  每把武器可分别填写 PVE / PVP 评级与 Perk 组合。
 * ============================================================
 */

const WEAPON_DATA = ${payload};
`;
}

function downloadDataJs(data) {
  const blob = new Blob([buildDataJs(data)], {
    type: "text/javascript;charset=utf-8",
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.js";
  a.click();
  URL.revokeObjectURL(url);
}

function emptyWeapon() {
  return {
    id: "",
    name: "",
    weaponType: "",
    ammoType: "",
    ratingPve: "",
    ratingPvp: "",
    frame: "",
    rpm: "",
    element: "",
    antiChamp: "",
    showPvePerk: true,
    showPvpPerk: true,
    perk3Pve: "",
    perk4Pve: "",
    perk1Pvp: "",
    perk2Pvp: "",
    perk3Pvp: "",
    perk4Pvp: "",
    note: "",
  };
}

const WEAPON_TYPES = [
  "自动步枪",
  "微型冲锋枪",
  "手枪",
  "手炮",
  "脉冲步枪",
  "战斗弓箭",
  "斥候步枪",
  "霰弹枪",
  "追踪步枪",
  "融合步枪",
  "狙击步枪",
  "偃月",
  "火箭发射器",
  "线性融合步枪",
  "榴弹发射器",
  "机枪",
  "刀剑",
];

const AMMO_TYPES = ["主要", "特殊", "威能"];

const RATING_TIERS = ["S", "A+", "A", "B+", "B", "C+", "C", "D"];

function ratingTierClass(rating) {
  const raw = String(rating || "").trim().toUpperCase();
  if (!raw) return "rating-empty";
  const normalized = raw.replace(/\s+/g, "");
  const map = {
    S: "rating-S",
    "A+": "rating-Ap",
    A: "rating-A",
    "B+": "rating-Bp",
    B: "rating-B",
    "C+": "rating-Cp",
    C: "rating-C",
    D: "rating-D",
  };
  return map[normalized] || "rating-empty";
}

/** 旧译名 → 当前译名（兼容已保存草稿） */
const ELEMENT_ALIASES = {
  太阳: "烈日",
  弧光: "电弧",
  冻结: "冰影",
  源质: "缚丝",
};

const CHAMP_ALIASES = {
  破障: "屏障",
  压制: "势不可挡",
};

function normalizeElementName(element) {
  if (!element) return "";
  return ELEMENT_ALIASES[element] || element;
}

function normalizeChampName(value) {
  if (!value || value === "无") return "";
  const first = String(value)
    .split(/[/、,，]/)
    .map((part) => part.trim())
    .filter(Boolean)[0];
  if (!first || first === "无") return "";
  return CHAMP_ALIASES[first] || first;
}

function hasRollContent(weapon, mode) {
  const suffix = mode === "pvp" ? "Pvp" : "Pve";
  if (mode === "pve") {
    return Boolean(
      weapon.ratingPve || weapon.perk3Pve || weapon.perk4Pve
    );
  }
  return Boolean(
    weapon[`rating${suffix}`] ||
      weapon[`perk1${suffix}`] ||
      weapon[`perk2${suffix}`] ||
      weapon[`perk3${suffix}`] ||
      weapon[`perk4${suffix}`]
  );
}

function splitLegacyFrame(frame) {
  const raw = String(frame || "").trim();
  if (!raw) return { frame: "", rpm: "" };
  const parts = raw.split(/\s*[·•]\s*/);
  if (parts.length >= 2) {
    return {
      frame: parts[0].trim(),
      rpm: parts.slice(1).join(" · ").trim(),
    };
  }
  return { frame: raw, rpm: "" };
}

function formatFrameRpm(weapon) {
  const frame = String(weapon.frame || "").trim();
  const rpm = String(weapon.rpm || "").trim();
  if (frame && rpm) return `${frame}\n${rpm}`;
  return frame || rpm || "—";
}

function migrateLegacyWeapon(weapon) {
  const next = { ...emptyWeapon(), ...weapon };
  if (weapon && weapon.id) next.id = String(weapon.id);

  next.element = normalizeElementName(next.element);
  next.antiChamp = normalizeChampName(next.antiChamp);

  // 「弓箭」与「战斗弓箭」合并为战斗弓箭
  if (String(next.weaponType || "").trim() === "弓箭") {
    next.weaponType = "战斗弓箭";
  }

  // 旧单套字段 → 迁到 PVE（仅保留 3/4）
  if (weapon.rating && !weapon.ratingPve) next.ratingPve = weapon.rating;
  if (weapon.perk3 && !weapon.perk3Pve) next.perk3Pve = weapon.perk3;
  if (weapon.perk4 && !weapon.perk4Pve) next.perk4Pve = weapon.perk4;

  // 旧「框架 · 射速」合并字符串 → 拆成两栏
  if (!weapon.rpm && weapon.frame && /[·•]/.test(String(weapon.frame))) {
    const split = splitLegacyFrame(weapon.frame);
    next.frame = split.frame;
    next.rpm = split.rpm;
  } else if (typeof weapon.rpm !== "string") {
    next.rpm = weapon.rpm == null ? "" : String(weapon.rpm);
  }

  if (typeof weapon.showPvePerk !== "boolean") next.showPvePerk = true;
  if (typeof weapon.showPvpPerk !== "boolean") next.showPvpPerk = true;

  delete next.rating;
  delete next.perk1;
  delete next.perk2;
  delete next.perk3;
  delete next.perk4;
  delete next.perk1Pve;
  delete next.perk2Pve;

  return next;
}

function slugPart(value, maxLen) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^\w\u4e00-\u9fff-]/g, "")
    .slice(0, maxLen || 20);
}

function makeStableWeaponId(sectionId, index, name) {
  const slug = slugPart(name, 20) || "item";
  return `w-${sectionId || "sec"}-${index}-${slug}`;
}

function makeWeaponId(name) {
  const slug = slugPart(name, 16) || "item";
  return `w-${slug}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
}

function getWeaponMap(data) {
  const map = new Map();
  for (const weapon of data.weapons || []) {
    if (weapon?.id) map.set(weapon.id, weapon);
  }
  return map;
}

function resolveSectionWeapons(data, section) {
  const map = getWeaponMap(data);
  return (section?.weaponIds || [])
    .map((id) => map.get(id))
    .filter(Boolean);
}

function weaponSectionIds(data, weaponId) {
  if (!weaponId) return [];
  return (data.sections || [])
    .filter((section) => (section.weaponIds || []).includes(weaponId))
    .map((section) => section.id);
}

function purgeOrphanWeapons(data) {
  const used = new Set();
  for (const section of data.sections || []) {
    for (const id of section.weaponIds || []) used.add(id);
  }
  data.weapons = (data.weapons || []).filter((w) => w?.id && used.has(w.id));
}

function removeWeaponFromSection(data, weaponId, sectionId) {
  const section = (data.sections || []).find((s) => s.id === sectionId);
  if (!section) return;
  section.weaponIds = (section.weaponIds || []).filter((id) => id !== weaponId);
  if (!weaponSectionIds(data, weaponId).length) {
    data.weapons = (data.weapons || []).filter((w) => w.id !== weaponId);
  }
}

function addWeaponIdToSection(data, weaponId, sectionId) {
  const section = (data.sections || []).find((s) => s.id === sectionId);
  if (!section || !weaponId) return;
  if (!Array.isArray(section.weaponIds)) section.weaponIds = [];
  if (!section.weaponIds.includes(weaponId)) section.weaponIds.push(weaponId);
}

/** 同步一把武器所属途径（至少保留一个） */
function setWeaponSectionMembership(data, weaponId, sectionIds) {
  const wanted = [...new Set((sectionIds || []).filter(Boolean))];
  if (!wanted.length) return false;
  for (const section of data.sections || []) {
    const has = (section.weaponIds || []).includes(weaponId);
    const should = wanted.includes(section.id);
    if (should && !has) addWeaponIdToSection(data, weaponId, section.id);
    if (!should && has) {
      section.weaponIds = section.weaponIds.filter((id) => id !== weaponId);
    }
  }
  return true;
}

function normalizeWeaponData(data) {
  const next = cloneData(data);
  delete next.showPvePerk;
  delete next.showPvpPerk;
  if (typeof next.updatedAt !== "string") {
    next.updatedAt = next.updatedAt == null ? "" : String(next.updatedAt);
  }
  if (!Array.isArray(next.sections)) next.sections = [];
  if (!Array.isArray(next.weapons)) next.weapons = [];

  // 旧结构：sections[].weapons → 顶层 weapons + weaponIds
  for (const section of next.sections) {
    if (typeof section.note !== "string") {
      section.note = section.note == null ? "" : String(section.note);
    }
    if (!Array.isArray(section.weaponIds)) section.weaponIds = [];

    const nested = Array.isArray(section.weapons) ? section.weapons : [];
    if (nested.length) {
      nested.forEach((raw, index) => {
        const migrated = migrateLegacyWeapon(raw);
        const id =
          migrated.id ||
          makeStableWeaponId(section.id, index, migrated.name);
        migrated.id = id;
        if (!next.weapons.some((w) => w.id === id)) {
          next.weapons.push(migrated);
        }
        if (!section.weaponIds.includes(id)) section.weaponIds.push(id);
      });
    }
    delete section.weapons;
  }

  next.weapons = next.weapons.map((raw) => {
    const migrated = migrateLegacyWeapon(raw);
    if (!migrated.id) migrated.id = makeWeaponId(migrated.name);
    return migrated;
  });

  const validIds = new Set(next.weapons.map((w) => w.id));
  for (const section of next.sections) {
    section.weaponIds = (section.weaponIds || []).filter((id) =>
      validIds.has(id)
    );
  }

  purgeOrphanWeapons(next);
  return next;
}

function makeSectionId(title) {
  const base = String(title || "section")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^\w\u4e00-\u9fff-]/g, "")
    .slice(0, 24);
  return `${base || "section"}-${Date.now().toString(36)}`;
}

  function matchesFilters(weapon, filters) {
    const q = filters.q;

        weapon.perk2Pvp,
        weapon.perk3Pvp,

      if (!hay.includes(q)) return false;

    if (filters.weaponType && weapon.weaponType !== filters.weaponType) {

    if (filters.ammoType && weapon.ammoType !== filters.ammoType) {

  function tint(text, className) {

  function plainCell(value, extraClass, rowspan) {

      inner = `<span class="frame-line">${escapeHtml(frame)}</span><span class="frame-line">${escapeHtml(rpm)}</span>`;
      tip = ` title="${escapeHtml(`${frame} / ${rpm}`)}"`;
    } else if (frame || rpm) {
      const only = frame || rpm;
      inner = `<span class="frame-line">${escapeHtml(only)}</span>`;
      tip = ` title="${escapeHtml(only)}"`;
    }
    return `<td class="frame-cell"${rs}${tip}>${inner}</td>`;
  }

  function baseCells(weapon, rowspan) {
    return [
      plainCell(weapon.name, "name-cell", rowspan),
      plainCell(weapon.weaponType, "type-cell", rowspan),
      tintCell(weapon.ammoType, ammoClass(weapon.ammoType), "", rowspan),
      tintCell(weapon.ratingPve, ratingClass(weapon.ratingPve), "cell-pve", rowspan),
      tintCell(weapon.ratingPvp, ratingClass(weapon.ratingPvp), "cell-pvp", rowspan),
      frameCell(weapon, rowspan),
      tintCell(weapon.element, elementClass(weapon.element), "", rowspan),
      plainCell(weapon.antiChamp, "champ", rowspan),
    ].join("");
  }

  function noteCell(weapon, rowspan) {
    const text = weapon.note || "";
    if (!text) return td("—", "note-cell", rowspan, "");
    const inner = `<span class="note-text">${escapeHtml(text)}</span>`;
    return td(inner, "note-cell", rowspan, text);
  }

  function weaponSourceLabels(weaponId) {
    const ids = weaponSectionIds(DATA, weaponId);
    const titleById = new Map(
      (DATA.sections || []).map((section) => [
        section.id,
        section.title || section.id,
      ])
    );
    return ids
      .map((id) => titleById.get(id) || id)
      .map((title) => String(title || "").trim())
      .filter(Boolean);
  }

  /** 获取途径列（始终完整显示，多来源时分行） */
  function sourcesCell(weapon, rowspan) {
    const labels = weaponSourceLabels(weapon.id);
    const rs = rowspan > 1 ? ` rowspan="${rowspan}"` : "";
    if (!labels.length) {
      return `<td class="sources-cell"${rs}>—</td>`;
    }
    const tip = labels.join(" / ");
    const inner = labels
      .map((label) => `<span class="sources-line">${escapeHtml(label)}</span>`)
      .join("");
    return `<td class="sources-cell"${rs} title="${escapeHtml(tip)}">${inner}</td>`;
  }

  function cell(value, extraClass) {
    return plainCell(value, extraClass, 1);
  }

  /** Perk 含 `/` 时在查看页格内分行（不显示斜杠） */
  function perkCell(value, extraClass) {
    const raw = String(value || "").trim();
    if (!raw) return td("—", extraClass, 1, "—");
    if (!raw.includes("/")) {
      return td(escapeHtml(raw), extraClass, 1, raw);
    }
    const parts = raw
      .split("/")
      .map((part) => part.trim())
      .filter(Boolean);
    if (parts.length <= 1) {
      return td(escapeHtml(raw), extraClass, 1, raw);
    }
    const inner = parts
      .map((part) => `<span class="perk-line">${escapeHtml(part)}</span>`)
      .join("");
    const cls = extraClass ? `${extraClass} perk-multiline` : "perk-multiline";
    return td(inner, cls, 1, raw);
  }

  function emptyPerkCells() {
    return `
      <td class="mode-tag-cell">—</td>
      ${cell("—", "perk-cell")}
      ${cell("—", "perk-cell")}
      ${cell("—", "perk-cell")}
      ${cell("—", "perk-cell")}
    `;
  }

  function bothPerkCellsPve(weapon) {
    return `
      <td class="mode-tag-cell cell-pve">PVE</td>
      ${cell("—", "perk-cell cell-pve")}
      ${cell("—", "perk-cell cell-pve")}
      ${perkCell(weapon.perk3Pve, "perk-cell cell-pve")}
      ${perkCell(weapon.perk4Pve, "perk-cell cell-pve")}
    `;
  }

  function bothPerkCellsPvp(weapon) {
    return `
      <td class="mode-tag-cell cell-pvp">PVP</td>
      ${perkCell(weapon.perk1Pvp, "perk-cell cell-pvp")}
      ${perkCell(weapon.perk2Pvp, "perk-cell cell-pvp")}
      ${perkCell(weapon.perk3Pvp, "perk-cell cell-pvp")}
      ${perkCell(weapon.perk4Pvp, "perk-cell cell-pvp")}
    `;
  }

  function weaponFlags(weapon) {
    return {
      showPve: weapon.showPvePerk !== false,
      showPvp: weapon.showPvpPerk !== false,
    };
  }

  /** 结合查看页开关与武器自身展 PVE/PVP 配置 */
  function resolveDisplay(weapon, viewPve, viewPvp) {
    const { showPve, showPvp } = weaponFlags(weapon);

    if (viewPve && viewPvp) {
      return { visible: true, showPve, showPvp };
    }

    if (viewPve && !viewPvp) {
      if (!showPve) return { visible: false, showPve: false, showPvp: false };
      return { visible: true, showPve: true, showPvp: false };
    }

    if (viewPvp && !viewPve) {
      if (!showPvp) return { visible: false, showPve: false, showPvp: false };
      return { visible: true, showPve: false, showPvp: true };
    }

    return { visible: false, showPve: false, showPvp: false };
  }

  function weaponRows(weapon, showPve, showPvp, pairClass, showSources) {
    const sourcePart = (rowspan) =>
      showSources ? sourcesCell(weapon, rowspan) : "";

    if (showPve && showPvp) {
      return `
        <tr class="weapon-row ${pairClass}">
          ${baseCells(weapon, 2)}
          ${bothPerkCellsPve(weapon)}
          ${sourcePart(2)}
          ${noteCell(weapon, 2)}
        </tr>
        <tr class="weapon-row weapon-row-cont ${pairClass}">
          ${bothPerkCellsPvp(weapon)}
        </tr>
      `;
    }

    if (showPve) {
      return `
        <tr class="weapon-row ${pairClass}">
          ${baseCells(weapon, 1)}
          ${bothPerkCellsPve(weapon)}
          ${sourcePart(1)}
          ${noteCell(weapon, 1)}
        </tr>
      `;
    }

    if (showPvp) {
      return `
        <tr class="weapon-row ${pairClass}">
          ${baseCells(weapon, 1)}
          ${bothPerkCellsPvp(weapon)}
          ${sourcePart(1)}
          ${noteCell(weapon, 1)}
        </tr>
      `;
    }

    return `
      <tr class="weapon-row ${pairClass}">
        ${baseCells(weapon, 1)}
        ${emptyPerkCells()}
        ${sourcePart(1)}
        ${noteCell(weapon, 1)}
      </tr>
    `;
  }

  function colGroup(showSources) {
    return `<colgroup>
      <col class="col-name" />
      <col class="col-type" />
      <col class="col-ammo" />
      <col class="col-rating" />
      <col class="col-rating" />
      <col class="col-frame" />
      <col class="col-element" />
      <col class="col-champ" />
      <col class="col-mode" />
      <col class="col-perk" />
      <col class="col-perk" />
      <col class="col-perk" />
      <col class="col-perk" />
      ${showSources ? '<col class="col-sources" />' : ""}
      <col class="col-note" />
    </colgroup>`;
  }

  function tableHead(showSources) {
    return `
      <thead>
        <tr>
          <th rowspan="2">武器名</th>
          <th rowspan="2">武器类型</th>
          <th rowspan="2">弹药类型</th>
          <th class="th-pve" rowspan="2">PVE评级</th>
          <th class="th-pvp" rowspan="2">PVP评级</th>
          <th rowspan="2">框架/射速</th>
          <th rowspan="2">属性</th>
          <th rowspan="2">反勇士</th>
          <th class="th-group" colspan="5">Perk 组合</th>
          ${showSources ? '<th rowspan="2">获取途径</th>' : ""}
          <th rowspan="2">备注</th>
        </tr>
        <tr>
          <th>用途</th>
          <th>1</th>
          <th>2</th>
          <th>3</th>
          <th>4</th>
        </tr>
      </thead>
    `;
  }

  function renderWeaponTable(weapons, showSources, emptyMessage) {
    const span = showSources ? 15 : 14;
    const rows =
      weapons.length > 0
        ? weapons
            .map((item, i) =>
              weaponRows(
                item.weapon,
                item.display.showPve,
                item.display.showPvp,
                i % 2 === 0 ? "row-a" : "row-b",
                showSources
              )
            )
            .join("")
        : `<tr class="empty-row"><td colspan="${span}">${emptyMessage}</td></tr>`;

    return `
      <div class="table-wrap">
        <table class="weapon-table${showSources ? " weapon-table-with-sources" : ""}">
          ${colGroup(showSources)}
          ${tableHead(showSources)}
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function render() {
    const viewPve = viewShowPve.checked;
    const viewPvp = viewShowPvp.checked;

    const filters = {
      q: searchInput.value.trim().toLowerCase(),
      weaponType: typeFilter.value,
      ammoType: ammoFilter.value,
      sectionId: sectionFilter.value,
      element: elementFilter.value,
      champ: champFilter.value,
    };

    const showSources = !filters.sectionId;
    let visible = 0;
    const parts = [];

    if (showSources) {
      const catalog = Array.isArray(DATA.weapons) ? DATA.weapons : [];
      const weapons = catalog
        .filter((w) => matchesFilters(w, filters))
        .map((w) => ({
          weapon: w,
          display: resolveDisplay(w, viewPve, viewPvp),
        }))
        .filter((item) => item.display.visible);

      visible = weapons.length;
      parts.push(`
        <section class="section" data-section="all">
          <div class="section-header section-header-static">
            <div class="section-title">
              <h2>全部武器</h2>
              <span class="section-count">${weapons.length} / ${catalog.length} 把</span>
            </div>
          </div>
          <div class="section-body">
            ${renderWeaponTable(
              weapons,
              true,
              catalog.length === 0
                ? "暂无武器，请在编辑器中添加"
                : "当前筛选条件下无匹配武器"
            )}
          </div>
        </section>
      `);
    } else {
      for (const section of DATA.sections) {
        const sectionKey = section.id || section.title;
        if (sectionKey !== filters.sectionId) continue;

        const sectionWeapons = resolveSectionWeapons(DATA, section);
        const weapons = sectionWeapons
          .filter((w) => matchesFilters(w, filters))
          .map((w) => ({
            weapon: w,
            display: resolveDisplay(w, viewPve, viewPvp),
          }))
          .filter((item) => item.display.visible);

        visible += weapons.length;

        const collapsed =
          weapons.length === 0 && sectionWeapons.length > 0
            ? " collapsed"
            : "";

        parts.push(`
          <section class="section${collapsed}" data-section="${escapeHtml(section.id || section.title)}">
            <button type="button" class="section-header" aria-expanded="${collapsed ? "false" : "true"}">
              <div class="section-title">
                <h2>${escapeHtml(section.title)}</h2>
                <span class="section-count">${weapons.length} / ${sectionWeapons.length} 把</span>
              </div>
              ${
                String(section.note || "").trim()
                  ? `<span class="section-note">${escapeHtml(String(section.note).trim())}</span>`
                  : `<span class="section-note section-note-empty" aria-hidden="true"></span>`
              }
              <span class="section-chevron" aria-hidden="true"></span>
            </button>
            <div class="section-body">
              ${renderWeaponTable(
                weapons,
                false,
                sectionWeapons.length === 0
                  ? "此途径暂无武器，请在编辑器中添加"
                  : "当前筛选条件下无匹配武器"
              )}
            </div>
          </section>
        `);
      }
    }

    countVisible.textContent = String(visible);

    if (parts.length === 0) {
      root.innerHTML = '<p class="no-results">没有可显示的分块。</p>';
      return;
    }

    root.innerHTML = `<div class="sections">${parts.join("")}</div>`;

    root.querySelectorAll(".section-header:not(.section-header-static)").forEach((btn) => {
      btn.addEventListener("click", () => {
        const section = btn.closest(".section");
        const collapsed = section.classList.toggle("collapsed");
        btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      });
    });

    bindTableHScroll();
  }

  /** 窗口底部固定横向滚动条，与表格区域横向滚动同步 */
  let hScrollBound = false;
  let hScrollSyncing = false;

  function bindTableHScroll() {
    const bar = document.getElementById("table-hscroll");
    const spacer = bar?.querySelector(".table-hscroll-spacer");
    const wrap = root.querySelector(".table-wrap");
    const table = wrap?.querySelector("table");
    if (!bar || !spacer) return;

    function layout() {
      if (!wrap || !table || !wrap.isConnected) {
        bar.hidden = true;
        bar.setAttribute("aria-hidden", "true");
        document.body.classList.remove("has-table-hscroll");
        return;
      }
      const rect = wrap.getBoundingClientRect();
      const need = table.scrollWidth > wrap.clientWidth + 1;
      bar.hidden = !need;
      bar.setAttribute("aria-hidden", need ? "false" : "true");
      document.body.classList.toggle("has-table-hscroll", need);
      if (!need) return;

      bar.style.left = `${Math.max(0, rect.left)}px`;
      bar.style.width = `${Math.max(0, rect.width)}px`;
      spacer.style.width = `${table.scrollWidth}px`;
      if (!hScrollSyncing) bar.scrollLeft = wrap.scrollLeft;
    }

    if (!hScrollBound) {
      hScrollBound = true;
      bar.addEventListener("scroll", () => {
        const currentWrap = root.querySelector(".table-wrap");
        if (!currentWrap || hScrollSyncing) return;
        hScrollSyncing = true;
        currentWrap.scrollLeft = bar.scrollLeft;
        hScrollSyncing = false;
      });
      window.addEventListener("scroll", layout, { passive: true });
      window.addEventListener("resize", layout);
    }

    wrap.addEventListener("scroll", () => {
      if (hScrollSyncing || bar.hidden) return;
      hScrollSyncing = true;
      bar.scrollLeft = wrap.scrollLeft;
      hScrollSyncing = false;
    });

    requestAnimationFrame(layout);
  }

  searchInput.addEventListener("input", render);
  typeFilter.addEventListener("change", render);
  ammoFilter.addEventListener("change", render);
  sectionFilter.addEventListener("change", render);
  elementFilter.addEventListener("change", render);
  champFilter.addEventListener("change", render);
  viewShowPve.addEventListener("change", render);
  viewShowPvp.addEventListener("change", render);
  resetBtn.addEventListener("click", () => {
    searchInput.value = "";
    typeFilter.value = "";
    ammoFilter.value = "";
    sectionFilter.value = "";
    elementFilter.value = "";
    champFilter.value = "";
    viewShowPve.checked = true;
    viewShowPvp.checked = true;
    render();
  });

  render();
})();
</script>
</body>
</html>
