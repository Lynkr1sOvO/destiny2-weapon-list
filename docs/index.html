<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>凯旋纪念碑 全武器刷取清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-deep: #0b0e12;
  --bg-panel: #12171f;
  --bg-row: #161c26;
  --bg-row-alt: #1a212c;
  --bg-hover: #222b38;
  --line: rgba(212, 175, 95, 0.18);
  --line-strong: rgba(212, 175, 95, 0.35);
  --gold: #d4af5f;
  --gold-soft: #e6c98a;
  --text: #e8edf4;
  --text-dim: #9aa6b8;
  --text-mute: #6d7a8c;
  --solar: #ff6b2c;
  --arc: #79e0ff;
  --void: #b07aff;
  --stasis: #4d8fff;
  --strand: #2fd67a;
  --kinetic: #e4e8ef;
  --ammo-primary: #f4f6fa;
  --ammo-special: #3dce6e;
  --ammo-heavy: #c48bff;
  --s: #f0c14a;
  --ap: #9be07a;
  --a: #7dcf8a;
  --bp: #8eb8e8;
  --b: #7aa6d9;
  --cp: #a8b4c4;
  --c: #9aa6b8;
  --d: #c48888;
  --radius: 2px;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --font-display: "Orbitron", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", "Segoe UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse 90% 50% at 10% -10%, rgba(212, 175, 95, 0.12), transparent 55%),
    radial-gradient(ellipse 70% 40% at 100% 0%, rgba(60, 90, 130, 0.18), transparent 50%),
    linear-gradient(180deg, #0f141c 0%, var(--bg-deep) 40%, #080a0e 100%);
  background-attachment: fixed;
}

.bg-grid {
  pointer-events: none;
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(212, 175, 95, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 175, 95, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 85%);
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  width: min(1480px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 2.5rem 0 4rem;
}

/* —— Header —— */
.hero {
  margin-bottom: 1.75rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
}

.hero-kicker {
  margin: 0 0 0.5rem;
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
}

.hero h1 {
  margin: 0 0 0.6rem;
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3.5vw, 2.35rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.2;
  color: var(--text);
}

.hero-note {
  margin: 0;
  max-width: 42rem;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--text-dim);
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 1.25rem 1.75rem;
  margin-top: 1.25rem;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--gold-soft);
}

.stat-label {
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  color: var(--text-mute);
}

/* —— Toolbar —— */
.toolbar {
  display: grid;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
  padding: 1rem;
  background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}

@media (min-width: 900px) {
  .toolbar {
    grid-template-columns: 1.1fr repeat(5, minmax(0, 0.85fr)) auto auto;
    align-items: end;
  }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field label {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-mute);
}

.field input,
.field select {
  width: 100%;
  padding: 0.55rem 0.7rem;
  font: inherit;
  font-size: 0.9rem;
  color: var(--text);
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.15s ease;
}

.field input:focus,
.field select:focus {
  border-color: var(--line-strong);
}

.field input::placeholder {
  color: var(--text-mute);
}

.btn-reset {
  height: 2.35rem;
  padding: 0 1rem;
  font: inherit;
  font-size: 0.85rem;
  color: var(--gold-soft);
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.btn-reset:hover {
  color: var(--bg-deep);
  background: var(--gold);
}

/* —— Sections —— */
.sections {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.section {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-panel) 94%, transparent);
  box-shadow: var(--shadow);
  overflow: clip;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: 100%;
  padding: 0.9rem 1.1rem;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: linear-gradient(90deg, rgba(212, 175, 95, 0.12), transparent 55%);
  border: 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.section-header:hover {
  background: linear-gradient(90deg, rgba(212, 175, 95, 0.18), transparent 60%);
}

.section-title {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  min-width: 0;
}

.section-title h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.06em;
}

.section-count {
  font-size: 0.78rem;
  color: var(--text-mute);
  white-space: nowrap;
}

.section-chevron {
  flex-shrink: 0;
  width: 0.55rem;
  height: 0.55rem;
  border-right: 2px solid var(--gold);
  border-bottom: 2px solid var(--gold);
  transform: rotate(45deg);
  transition: transform 0.2s ease;
}

.section.collapsed .section-chevron {
  transform: rotate(-45deg);
}

.section.collapsed .section-body {
  display: none;
}

.table-wrap {
  overflow-x: auto;
}

table,
.weapon-table {
  width: 100%;
  min-width: 1100px;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 0.82rem;
}

.weapon-table col.col-name { width: 7.5rem; }
.weapon-table col.col-type { width: 6.5rem; }
.weapon-table col.col-ammo { width: 4.2rem; }
.weapon-table col.col-rating { width: 4.2rem; }
.weapon-table col.col-frame { width: 6.5rem; }
.weapon-table col.col-element { width: 3.8rem; }
.weapon-table col.col-champ { width: 5.2rem; }
.weapon-table col.col-mode { width: 3.4rem; }
.weapon-table col.col-perk { width: 7rem; }
.weapon-table col.col-note { width: 7rem; }

th,
td {
  box-sizing: border-box;
  height: 2.75rem;
  max-height: 2.75rem;
  padding: 0 0.45rem;
  text-align: center;
  vertical-align: middle;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 2.4rem;
  max-height: 2.4rem;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-mute);
  background: var(--bg-panel);
}

tbody tr.weapon-row.row-a {
  background: var(--bg-row);
}

tbody tr.weapon-row.row-b {
  background: var(--bg-row-alt);
}

tbody tr.weapon-row:hover {
  background: var(--bg-hover);
}

.name-cell {
  font-weight: 600;
  color: var(--text);
}

.note-cell {
  color: var(--text-dim);
}

.perk-cell {
  color: var(--text-dim);
}

.weapon-table td.perk-cell.perk-multiline {
  white-space: normal !important;
  line-height: 1.25;
  height: auto !important;
  max-height: none !important;
  min-height: 2.75rem;
  overflow: visible !important;
  text-overflow: unset;
  vertical-align: middle;
  padding-top: 0.35rem;
  padding-bottom: 0.35rem;
}

.weapon-table td.perk-cell .perk-line {
  display: block;
  white-space: nowrap;
}

.mode-tag-cell {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.th-pve,
.cell-pve {
  background: rgba(61, 140, 90, 0.08);
}

.th-pvp,
.cell-pvp {
  background: rgba(180, 90, 70, 0.08);
}

th.th-group {
  text-align: center;
  letter-spacing: 0.12em;
}

th.th-pve {
  color: #8fd4a4;
  border-bottom-color: rgba(125, 207, 138, 0.25);
}

th.th-pvp {
  color: #e8a090;
  border-bottom-color: rgba(232, 140, 110, 0.25);
}

.weapon-table td.frame-cell {
  color: var(--text-dim);
  white-space: normal !important;
  line-height: 1.25;
  height: auto !important;
  max-height: none !important;
  min-height: 2.75rem;
  overflow: visible !important;
  text-overflow: unset;
  vertical-align: middle;
  padding-top: 0.35rem;
  padding-bottom: 0.35rem;
}

.weapon-table td.frame-cell .frame-line {
  display: block;
  white-space: nowrap;
}

/* —— Tints (no boxes) —— */
.tint {
  font-weight: 600;
  letter-spacing: 0.03em;
}

.rating-S { color: var(--s); }
.rating-Ap { color: var(--ap); }
.rating-A { color: var(--a); }
.rating-Bp { color: var(--bp); }
.rating-B { color: var(--b); }
.rating-Cp { color: var(--cp); }
.rating-C { color: var(--c); }
.rating-D { color: var(--d); }
.rating-empty { color: var(--text-mute); }

.el-动能 { color: var(--kinetic); }
.el-烈日 { color: var(--solar); }
.el-电弧 { color: var(--arc); }
.el-虚空 { color: var(--void); }
.el-冰影 { color: var(--stasis); }
.el-缚丝 { color: var(--strand); }

.ammo-主要 { color: var(--ammo-primary); }
.ammo-特殊 { color: var(--ammo-special); }
.ammo-威能 { color: var(--ammo-heavy); }

.type-cell {
  color: var(--text-dim);
}

.champ {
  color: var(--gold-soft);
  font-size: 0.82rem;
}

.toggle-group {
  display: flex;
  gap: 0.4rem;
  height: 2.35rem;
  align-items: center;
}

.toggle-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  height: 2.35rem;
  padding: 0 0.7rem;
  font-size: 0.82rem;
  color: var(--text-dim);
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  user-select: none;
}

.toggle-chip:has(input:checked) {
  color: var(--gold-soft);
  border-color: var(--line-strong);
  background: rgba(212, 175, 95, 0.1);
}

.toggle-chip input {
  accent-color: var(--gold);
}

.empty-row td {
  height: auto;
  max-height: none;
  padding: 1.25rem;
  text-align: center;
  color: var(--text-mute);
  font-style: italic;
  white-space: normal;
}

.no-results {
  margin-top: 1.5rem;
  padding: 2rem;
  text-align: center;
  color: var(--text-mute);
  border: 1px dashed var(--line);
}

.footer-hint {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
  line-height: 1.6;
  color: var(--text-mute);
}

.footer-hint code {
  padding: 0.1rem 0.35rem;
  font-size: 0.78rem;
  color: var(--gold-soft);
  background: rgba(212, 175, 95, 0.1);
  border: 1px solid var(--line);
}

@media (max-width: 719px) {
  .page {
    width: calc(100% - 1.25rem);
    padding-top: 1.5rem;
  }

  th,
  td {
    padding: 0.55rem 0.65rem;
  }

  .note-cell {
    max-width: 12rem;
  }
}

/* —— Shared nav / status —— */
.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.hero-compact {
  margin-bottom: 1.1rem;
  padding-bottom: 1.1rem;
}

.hero-compact h1 {
  font-size: clamp(1.35rem, 3vw, 1.9rem);
}

.nav-links {
  display: flex;
  gap: 0.5rem;
  flex-shrink: 0;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  padding: 0.55rem 0.95rem;
  font-size: 0.85rem;
  color: var(--gold-soft);
  text-decoration: none;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  transition: background 0.15s ease, color 0.15s ease;
}

.nav-link:hover,
.nav-link-primary {
  color: var(--bg-deep);
  background: var(--gold);
  border-color: var(--gold);
}

.nav-link-primary:hover {
  background: var(--gold-soft);
}

.status-bar {
  margin-bottom: 1rem;
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  line-height: 1.5;
  border: 1px solid var(--line);
  background: rgba(212, 175, 95, 0.08);
  color: var(--text-dim);
}

.status-bar code {
  padding: 0.05rem 0.3rem;
  color: var(--gold-soft);
  background: rgba(212, 175, 95, 0.1);
  border: 1px solid var(--line);
}

.status-ok {
  border-color: rgba(125, 207, 138, 0.35);
  background: rgba(125, 207, 138, 0.08);
}

.status-error {
  border-color: rgba(232, 110, 90, 0.4);
  background: rgba(232, 110, 90, 0.1);
  color: #f0b4a8;
}

.status-info {
  border-color: rgba(122, 166, 217, 0.35);
  background: rgba(122, 166, 217, 0.08);
}

.footer-hint a {
  color: var(--gold-soft);
}

/* —— Editor —— */
.page-wide {
  width: min(1680px, calc(100% - 2rem));
}

.meta-panel {
  display: grid;
  gap: 0.75rem;
  margin-bottom: 1rem;
  padding: 1rem;
  background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
  border: 1px solid var(--line);
}

@media (min-width: 800px) {
  .meta-panel {
    grid-template-columns: minmax(220px, 1fr) 2fr;
  }
}

.field-grow {
  min-width: 0;
}

.editor-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1.25rem;
}

.btn-primary,
.btn-secondary,
.btn-ghost,
.btn-file {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2.35rem;
  padding: 0 0.95rem;
  font: inherit;
  font-size: 0.85rem;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.btn-primary {
  color: var(--bg-deep);
  background: var(--gold);
  border: 1px solid var(--gold);
}

.btn-primary:hover {
  background: var(--gold-soft);
}

.btn-secondary,
.btn-file {
  color: var(--gold-soft);
  background: transparent;
  border: 1px solid var(--line-strong);
}

.btn-secondary:hover,
.btn-file:hover {
  color: var(--bg-deep);
  background: var(--gold);
}

.btn-ghost {
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--line);
}

.btn-ghost:hover {
  color: var(--text);
  border-color: var(--line-strong);
}

.btn-primary.sm,
.btn-secondary.sm,
.btn-ghost.sm {
  height: 2rem;
  padding: 0 0.7rem;
  font-size: 0.8rem;
}

.danger-text {
  color: #e89a8c !important;
}

.save-hint {
  margin-left: auto;
  font-size: 0.8rem;
  color: var(--text-mute);
}

.save-hint.is-dirty {
  color: var(--gold-soft);
}

.icon-btn {
  width: 1.7rem;
  height: 1.7rem;
  margin-right: 0.15rem;
  padding: 0;
  font: inherit;
  font-size: 0.85rem;
  line-height: 1;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
}

.icon-btn:hover {
  color: var(--text);
  border-color: var(--line-strong);
}

.icon-btn.danger:hover {
  color: #f0b4a8;
  border-color: rgba(232, 110, 90, 0.5);
}

/* —— Editor layout: list + form —— */
.editor-layout {
  display: grid;
  gap: 1rem;
  align-items: start;
  min-height: 28rem;
}

@media (min-width: 960px) {
  .editor-layout {
    grid-template-columns: minmax(260px, 320px) 1fr;
  }
}

.editor-sidebar {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-panel) 94%, transparent);
  box-shadow: var(--shadow);
  max-height: calc(100vh - 8rem);
  overflow: auto;
}

.editor-side-block {
  padding: 0.85rem;
  border-bottom: 1px solid var(--line);
}

.editor-side-block:last-child {
  border-bottom: 0;
  flex: 1;
}

.editor-side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.65rem;
}

.editor-side-head h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-soft);
}

.editor-side-list {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.editor-side-item {
  display: flex;
  align-items: flex-start;
  gap: 0.35rem;
  width: 100%;
  padding: 0.55rem 0.6rem;
  text-align: left;
  font: inherit;
  color: var(--text);
  background: var(--bg-deep);
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
}

.editor-side-item:hover {
  border-color: var(--line);
}

.editor-side-item.is-active {
  border-color: var(--line-strong);
  background: rgba(212, 175, 95, 0.1);
}

.editor-side-item-main {
  flex: 1;
  min-width: 0;
}

.editor-side-item-title {
  display: block;
  font-weight: 600;
  font-size: 0.88rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.editor-side-item-meta {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.72rem;
  color: var(--text-mute);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.editor-side-item-tools {
  display: flex;
  flex-shrink: 0;
  gap: 0.15rem;
}

.editor-section-rename {
  width: 100%;
  margin-bottom: 0.55rem;
  padding: 0.45rem 0.55rem;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  background: var(--bg-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.editor-section-rename:focus {
  outline: none;
  border-color: var(--line-strong);
}

.editor-side-empty {
  padding: 0.75rem 0.25rem;
  font-size: 0.82rem;
  color: var(--text-mute);
  font-style: italic;
}

.editor-main {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-panel) 94%, transparent);
  box-shadow: var(--shadow);
  min-height: 28rem;
}

.editor-form {
  padding: 1.1rem 1.2rem 1.4rem;
}

.editor-form-title {
  margin: 0 0 1rem;
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}

  <script>/** 本地草稿：编辑页写入，清单页优先读取 */
const D2_STORAGE_KEY = "d2-weapon-list-draft";

function cloneData(data) {
  return JSON.parse(JSON.stringify(data));
}

function loadWeaponData() {
  if (typeof D2_SHARE_READONLY !== "undefined" && D2_SHARE_READONLY) {
    return { data: normalizeWeaponData(WEAPON_DATA), fromDraft: false };
  }
  try {
    const raw = localStorage.getItem(D2_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sections)) {
        return { data: normalizeWeaponData(parsed), fromDraft: true };
      }
    }
  } catch (_) {
    /* ignore corrupt draft */
  }
  return { data: normalizeWeaponData(WEAPON_DATA), fromDraft: false };
}

function saveWeaponDraft(data) {
  localStorage.setItem(D2_STORAGE_KEY, JSON.stringify(data));
}

function clearWeaponDraft() {
  localStorage.removeItem(D2_STORAGE_KEY);
}

function buildDataJs(data) {
  const payload = JSON.stringify(data, null, 2);
  return `/**
 * ============================================================
 *  Destiny 2 本赛季武器清单 — 数据填写文件
 * ============================================================
 *  推荐用 editor.html 可视化编辑后「导出 data.js」覆盖本文件。
 *  每把武器可分别填写 PVE / PVP 评级与 Perk 组合。
 * ============================================================
 */

const WEAPON_DATA = ${payload};
`;
}

function downloadDataJs(data) {
  const blob = new Blob([buildDataJs(data)], {
    type: "text/javascript;charset=utf-8",
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.js";
  a.click();
  URL.revokeObjectURL(url);
}

function emptyWeapon() {
  return {
    name: "",
    weaponType: "",
    ammoType: "",
    ratingPve: "",
    ratingPvp: "",
    frame: "",
    rpm: "",
    element: "",
    antiChamp: "",
    showPvePerk: true,
    showPvpPerk: true,
    perk3Pve: "",
    perk4Pve: "",
    perk1Pvp: "",
    perk2Pvp: "",
    perk3Pvp: "",
    perk4Pvp: "",
    note: "",
  };
}

const WEAPON_TYPES = [
  "自动步枪",
  "微型冲锋枪",
  "手枪",
  "手炮",
  "脉冲步枪",
  "弓箭",
  "斥候步枪",
  "霰弹枪",
  "追踪步枪",
  "融合步枪",
  "狙击步枪",
  "偃月",
  "火箭发射器",
  "线性融合步枪",
  "战斗弓箭",
  "榴弹发射器",
  "机枪",
  "刀剑",
];

const AMMO_TYPES = ["主要", "特殊", "威能"];

const RATING_TIERS = ["S", "A+", "A", "B+", "B", "C+", "C", "D"];

function ratingTierClass(rating) {
  const raw = String(rating || "").trim().toUpperCase();
  if (!raw) return "rating-empty";
  const normalized = raw.replace(/\s+/g, "");
  const map = {
    S: "rating-S",
    "A+": "rating-Ap",
    A: "rating-A",
    "B+": "rating-Bp",
    B: "rating-B",
    "C+": "rating-Cp",
    C: "rating-C",
    D: "rating-D",
  };
  return map[normalized] || "rating-empty";
}

/** 旧译名 → 当前译名（兼容已保存草稿） */
const ELEMENT_ALIASES = {
  太阳: "烈日",
  弧光: "电弧",
  冻结: "冰影",
  源质: "缚丝",
};

const CHAMP_ALIASES = {
  破障: "屏障",
  压制: "势不可挡",
};

function normalizeElementName(element) {
  if (!element) return "";
  return ELEMENT_ALIASES[element] || element;
}

function normalizeChampName(value) {
  if (!value || value === "无") return "";
  const first = String(value)
    .split(/[/、,，]/)
    .map((part) => part.trim())
    .filter(Boolean)[0];
  if (!first || first === "无") return "";
  return CHAMP_ALIASES[first] || first;
}

function hasRollContent(weapon, mode) {
  const suffix = mode === "pvp" ? "Pvp" : "Pve";
  if (mode === "pve") {
    return Boolean(
      weapon.ratingPve || weapon.perk3Pve || weapon.perk4Pve
    );
  }
  return Boolean(
    weapon[`rating${suffix}`] ||
      weapon[`perk1${suffix}`] ||
      weapon[`perk2${suffix}`] ||
      weapon[`perk3${suffix}`] ||
      weapon[`perk4${suffix}`]
  );
}

function splitLegacyFrame(frame) {
  const raw = String(frame || "").trim();
  if (!raw) return { frame: "", rpm: "" };
  const parts = raw.split(/\s*[·•]\s*/);
  if (parts.length >= 2) {
    return {
      frame: parts[0].trim(),
      rpm: parts.slice(1).join(" · ").trim(),
    };
  }
  return { frame: raw, rpm: "" };
}

function formatFrameRpm(weapon) {
  const frame = String(weapon.frame || "").trim();
  const rpm = String(weapon.rpm || "").trim();
  if (frame && rpm) return `${frame}\n${rpm}`;
  return frame || rpm || "—";
}

function migrateLegacyWeapon(weapon) {
  const next = { ...emptyWeapon(), ...weapon };

  next.element = normalizeElementName(next.element);
  next.antiChamp = normalizeChampName(next.antiChamp);

  // 旧单套字段 → 迁到 PVE（仅保留 3/4）
  if (weapon.rating && !weapon.ratingPve) next.ratingPve = weapon.rating;
  if (weapon.perk3 && !weapon.perk3Pve) next.perk3Pve = weapon.perk3;
  if (weapon.perk4 && !weapon.perk4Pve) next.perk4Pve = weapon.perk4;

  // 旧「框架 · 射速」合并字符串 → 拆成两栏
  if (!weapon.rpm && weapon.frame && /[·•]/.test(String(weapon.frame))) {
    const split = splitLegacyFrame(weapon.frame);
    next.frame = split.frame;
    next.rpm = split.rpm;
  } else if (typeof weapon.rpm !== "string") {
    next.rpm = weapon.rpm == null ? "" : String(weapon.rpm);
  }

  if (typeof weapon.showPvePerk !== "boolean") next.showPvePerk = true;
  if (typeof weapon.showPvpPerk !== "boolean") next.showPvpPerk = true;

  delete next.rating;
  delete next.perk1;
  delete next.perk2;
  delete next.perk3;
  delete next.perk4;
  delete next.perk1Pve;
  delete next.perk2Pve;

  return next;
}

function normalizeWeaponData(data) {
  const next = cloneData(data);
  delete next.showPvePerk;
  delete next.showPvpPerk;
  for (const section of next.sections || []) {
    section.weapons = (section.weapons || []).map(migrateLegacyWeapon);
  }
  return next;
}

function makeSectionId(title) {
  const base = String(title || "section")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^\w\u4e00-\u9fff-]/g, "")
    .slice(0, 24);
  return `${base || "section"}-${Date.now().toString(36)}`;
}
</script>
  <script>(function () {
  const root = document.getElementById("app");
  const searchInput = document.getElementById("search");
  const typeFilter = document.getElementById("filter-type");
  const ammoFilter = document.getElementById("filter-ammo");
  const ratingFilter = document.getElementById("filter-rating");
  const elementFilter = document.getElementById("filter-element");
  const champFilter = document.getElementById("filter-champ");
  const viewShowPve = document.getElementById("view-show-pve");
  const viewShowPvp = document.getElementById("view-show-pvp");
  const resetBtn = document.getElementById("reset-filters");
  const countTotal = document.getElementById("count-total");
  const countVisible = document.getElementById("count-visible");
  const countSections = document.getElementById("count-sections");
  const seasonTitle = document.getElementById("season-title");
  const seasonNote = document.getElementById("season-note");
  const draftBanner = document.getElementById("draft-banner");

  const loaded = loadWeaponData();
  const DATA = loaded.data;

  if (!DATA || !Array.isArray(DATA.sections)) {
    root.innerHTML =
      '<p class="no-results">未找到数据。请确认 <code>data.js</code> 已正确加载。</p>';
    return;
  }

  if (draftBanner) {
    draftBanner.hidden = !loaded.fromDraft;
  }

  seasonTitle.textContent = DATA.seasonTitle || "Destiny 2 武器清单";
  seasonNote.textContent = DATA.seasonNote || "";

  const totalWeapons = DATA.sections.reduce(
    (sum, s) => sum + (s.weapons?.length || 0),
    0
  );
  countTotal.textContent = String(totalWeapons);
  countSections.textContent = String(DATA.sections.length);

  // 填充武器类型选项
  WEAPON_TYPES.forEach((type) => {
    const opt = document.createElement("option");
    opt.value = type;
    opt.textContent = type;
    typeFilter.appendChild(opt);
  });

  function ratingClass(rating) {
    return ratingTierClass(rating);
  }

  function elementClass(element) {
    const known = ["动能", "烈日", "电弧", "虚空", "冰影", "缚丝"];
    return known.includes(element) ? `el-${element}` : "";
  }

  function ammoClass(ammo) {
    const known = ["主要", "特殊", "威能"];
    return known.includes(ammo) ? `ammo-${ammo}` : "";
  }

  function matchesFilters(weapon, filters) {
    const q = filters.q;
    if (q) {
      const hay = [
        weapon.name,
        weapon.weaponType,
        weapon.ammoType,
        weapon.frame,
        weapon.rpm,
        weapon.element,
        weapon.antiChamp,
        weapon.ratingPve,
        weapon.ratingPvp,
        weapon.perk3Pve,
        weapon.perk4Pve,
        weapon.perk1Pvp,
        weapon.perk2Pvp,
        weapon.perk3Pvp,
        weapon.perk4Pvp,
        weapon.note,
      ]
        .join(" ")
        .toLowerCase();
      if (!hay.includes(q)) return false;
    }

    if (filters.weaponType && weapon.weaponType !== filters.weaponType) {
      return false;
    }

    if (filters.ammoType && weapon.ammoType !== filters.ammoType) {
      return false;
    }

    if (filters.rating) {
      const want = String(filters.rating).trim().toUpperCase();
      const pve = String(weapon.ratingPve || "").trim().toUpperCase();
      const pvp = String(weapon.ratingPvp || "").trim().toUpperCase();
      if (pve !== want && pvp !== want) return false;
    }

    if (filters.element && weapon.element !== filters.element) return false;

    if (filters.champ) {
      if (String(weapon.antiChamp || "") !== filters.champ) return false;
    }

    return true;
  }

  function tint(text, className) {
    const label = text || "—";
    return `<span class="tint ${className}">${escapeHtml(label)}</span>`;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function td(content, extraClass, rowspan, title) {
    const rs = rowspan > 1 ? ` rowspan="${rowspan}"` : "";
    const cls = extraClass ? ` class="${extraClass}"` : "";
    const tip = title ? ` title="${escapeHtml(title)}"` : "";
    return `<td${cls}${rs}${tip}>${content}</td>`;
  }

  function plainCell(value, extraClass, rowspan) {
    const text = value || "—";
    return td(escapeHtml(text), extraClass, rowspan, text);
  }

  function tintCell(value, className, extraClass, rowspan) {
    const text = value || "—";
    return td(tint(text, className), extraClass, rowspan, text);
  }

  function frameCell(weapon, rowspan) {
    const frame = String(weapon.frame || "").trim();
    const rpm = String(weapon.rpm || "").trim();
    const rs = rowspan > 1 ? ` rowspan="${rowspan}"` : "";
    let inner = "—";
    let tip = "";
    if (frame && rpm) {
      inner = `<span class="frame-line">${escapeHtml(frame)}</span><span class="frame-line">${escapeHtml(rpm)}</span>`;
      tip = ` title="${escapeHtml(`${frame} / ${rpm}`)}"`;
    } else if (frame || rpm) {
      const only = frame || rpm;
      inner = `<span class="frame-line">${escapeHtml(only)}</span>`;
      tip = ` title="${escapeHtml(only)}"`;
    }
    return `<td class="frame-cell"${rs}${tip}>${inner}</td>`;
  }

  function baseCells(weapon, rowspan) {
    return [
      plainCell(weapon.name, "name-cell", rowspan),
      plainCell(weapon.weaponType, "type-cell", rowspan),
      tintCell(weapon.ammoType, ammoClass(weapon.ammoType), "", rowspan),
      tintCell(weapon.ratingPve, ratingClass(weapon.ratingPve), "cell-pve", rowspan),
      tintCell(weapon.ratingPvp, ratingClass(weapon.ratingPvp), "cell-pvp", rowspan),
      frameCell(weapon, rowspan),
      tintCell(weapon.element, elementClass(weapon.element), "", rowspan),
      plainCell(weapon.antiChamp, "champ", rowspan),
    ].join("");
  }

  function noteCell(weapon, rowspan) {
    const text = weapon.note || "";
    return td(escapeHtml(text), "note-cell", rowspan, text);
  }

  function cell(value, extraClass) {
    return plainCell(value, extraClass, 1);
  }

  /** Perk 含 `/` 时在查看页格内分行（不显示斜杠） */
  function perkCell(value, extraClass) {
    const raw = String(value || "").trim();
    if (!raw) return td("—", extraClass, 1, "—");
    if (!raw.includes("/")) {
      return td(escapeHtml(raw), extraClass, 1, raw);
    }
    const parts = raw
      .split("/")
      .map((part) => part.trim())
      .filter(Boolean);
    if (parts.length <= 1) {
      return td(escapeHtml(raw), extraClass, 1, raw);
    }
    const inner = parts
      .map((part) => `<span class="perk-line">${escapeHtml(part)}</span>`)
      .join("");
    const cls = extraClass ? `${extraClass} perk-multiline` : "perk-multiline";
    return td(inner, cls, 1, raw);
  }

  function emptyPerkCells() {
    return `
      <td class="mode-tag-cell">—</td>
      ${cell("—", "perk-cell")}
      ${cell("—", "perk-cell")}
      ${cell("—", "perk-cell")}
      ${cell("—", "perk-cell")}
    `;
  }

  function bothPerkCellsPve(weapon) {
    return `
      <td class="mode-tag-cell cell-pve">PVE</td>
      ${cell("—", "perk-cell cell-pve")}
      ${cell("—", "perk-cell cell-pve")}
      ${perkCell(weapon.perk3Pve, "perk-cell cell-pve")}
      ${perkCell(weapon.perk4Pve, "perk-cell cell-pve")}
    `;
  }

  function bothPerkCellsPvp(weapon) {
    return `
      <td class="mode-tag-cell cell-pvp">PVP</td>
      ${perkCell(weapon.perk1Pvp, "perk-cell cell-pvp")}
      ${perkCell(weapon.perk2Pvp, "perk-cell cell-pvp")}
      ${perkCell(weapon.perk3Pvp, "perk-cell cell-pvp")}
      ${perkCell(weapon.perk4Pvp, "perk-cell cell-pvp")}
    `;
  }

  function weaponFlags(weapon) {
    return {
      showPve: weapon.showPvePerk !== false,
      showPvp: weapon.showPvpPerk !== false,
    };
  }

  /** 结合查看页开关与武器自身展 PVE/PVP 配置 */
  function resolveDisplay(weapon, viewPve, viewPvp) {
    const { showPve, showPvp } = weaponFlags(weapon);

    if (viewPve && viewPvp) {
      return { visible: true, showPve, showPvp };
    }

    if (viewPve && !viewPvp) {
      if (!showPve) return { visible: false, showPve: false, showPvp: false };
      return { visible: true, showPve: true, showPvp: false };
    }

    if (viewPvp && !viewPve) {
      if (!showPvp) return { visible: false, showPve: false, showPvp: false };
      return { visible: true, showPve: false, showPvp: true };
    }

    return { visible: false, showPve: false, showPvp: false };
  }

  function weaponRows(weapon, showPve, showPvp, pairClass) {
    if (showPve && showPvp) {
      return `
        <tr class="weapon-row ${pairClass}">
          ${baseCells(weapon, 2)}
          ${bothPerkCellsPve(weapon)}
          ${noteCell(weapon, 2)}
        </tr>
        <tr class="weapon-row weapon-row-cont ${pairClass}">
          ${bothPerkCellsPvp(weapon)}
        </tr>
      `;
    }

    if (showPve) {
      return `
        <tr class="weapon-row ${pairClass}">
          ${baseCells(weapon, 1)}
          ${bothPerkCellsPve(weapon)}
          ${noteCell(weapon, 1)}
        </tr>
      `;
    }

    if (showPvp) {
      return `
        <tr class="weapon-row ${pairClass}">
          ${baseCells(weapon, 1)}
          ${bothPerkCellsPvp(weapon)}
          ${noteCell(weapon, 1)}
        </tr>
      `;
    }

    return `
      <tr class="weapon-row ${pairClass}">
        ${baseCells(weapon, 1)}
        ${emptyPerkCells()}
        ${noteCell(weapon, 1)}
      </tr>
    `;
  }

  function colGroup() {
    return `<colgroup>
      <col class="col-name" />
      <col class="col-type" />
      <col class="col-ammo" />
      <col class="col-rating" />
      <col class="col-rating" />
      <col class="col-frame" />
      <col class="col-element" />
      <col class="col-champ" />
      <col class="col-mode" />
      <col class="col-perk" />
      <col class="col-perk" />
      <col class="col-perk" />
      <col class="col-perk" />
      <col class="col-note" />
    </colgroup>`;
  }

  function tableHead() {
    return `
      <thead>
        <tr>
          <th rowspan="2">武器名</th>
          <th rowspan="2">武器类型</th>
          <th rowspan="2">弹药类型</th>
          <th class="th-pve" rowspan="2">PVE评级</th>
          <th class="th-pvp" rowspan="2">PVP评级</th>
          <th rowspan="2">框架/射速</th>
          <th rowspan="2">属性</th>
          <th rowspan="2">反勇士</th>
          <th class="th-group" colspan="5">Perk 组合</th>
          <th rowspan="2">备注</th>
        </tr>
        <tr>
          <th>用途</th>
          <th>1</th>
          <th>2</th>
          <th>3</th>
          <th>4</th>
        </tr>
      </thead>
    `;
  }

  function render() {
    const viewPve = viewShowPve.checked;
    const viewPvp = viewShowPvp.checked;

    const filters = {
      q: searchInput.value.trim().toLowerCase(),
      weaponType: typeFilter.value,
      ammoType: ammoFilter.value,
      rating: ratingFilter.value,
      element: elementFilter.value,
      champ: champFilter.value,
    };

    let visible = 0;
    const parts = [];
    const span = 14;

    for (const section of DATA.sections) {
      const weapons = (section.weapons || [])
        .filter((w) => matchesFilters(w, filters))
        .map((w) => ({ weapon: w, display: resolveDisplay(w, viewPve, viewPvp) }))
        .filter((item) => item.display.visible);

      visible += weapons.length;

      const rows =
        weapons.length > 0
          ? weapons
              .map((item, i) =>
                weaponRows(
                  item.weapon,
                  item.display.showPve,
                  item.display.showPvp,
                  i % 2 === 0 ? "row-a" : "row-b"
                )
              )
              .join("")
          : `<tr class="empty-row"><td colspan="${span}">${
              (section.weapons || []).length === 0
                ? "此途径暂无武器，请在编辑器中添加"
                : "当前筛选条件下无匹配武器"
            }</td></tr>`;

      const collapsed =
        weapons.length === 0 && (section.weapons || []).length > 0
          ? " collapsed"
          : "";

      parts.push(`
        <section class="section${collapsed}" data-section="${escapeHtml(section.id || section.title)}">
          <button type="button" class="section-header" aria-expanded="${collapsed ? "false" : "true"}">
            <div class="section-title">
              <h2>${escapeHtml(section.title)}</h2>
              <span class="section-count">${weapons.length} / ${(section.weapons || []).length} 把</span>
            </div>
            <span class="section-chevron" aria-hidden="true"></span>
          </button>
          <div class="section-body">
            <div class="table-wrap">
              <table class="weapon-table">
                ${colGroup()}
                ${tableHead()}
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        </section>
      `);
    }

    countVisible.textContent = String(visible);

    if (parts.length === 0) {
      root.innerHTML = '<p class="no-results">没有可显示的分块。</p>';
      return;
    }

    root.innerHTML = `<div class="sections">${parts.join("")}</div>`;

    root.querySelectorAll(".section-header").forEach((btn) => {
      btn.addEventListener("click", () => {
        const section = btn.closest(".section");
        const collapsed = section.classList.toggle("collapsed");
        btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      });
    });
  }

  searchInput.addEventListener("input", render);
  typeFilter.addEventListener("change", render);
  ammoFilter.addEventListener("change", render);
  ratingFilter.addEventListener("change", render);
  elementFilter.addEventListener("change", render);
  champFilter.addEventListener("change", render);
  viewShowPve.addEventListener("change", render);
  viewShowPvp.addEventListener("change", render);
  resetBtn.addEventListener("click", () => {
    searchInput.value = "";
    typeFilter.value = "";
    ammoFilter.value = "";
    ratingFilter.value = "";
    elementFilter.value = "";
    champFilter.value = "";
    viewShowPve.checked = true;
    viewShowPvp.checked = true;
    render();
  });

  render();
})();
</script>
</body>
</html>
